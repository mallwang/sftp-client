[package]
name = "sftp-client"
version = "0.1.0"
description = "Kleiner SFTP-Client (Passwort- und SSH-Key-Login)"
edition = "2021"

[lib]
name = "sftp_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
# Reines Rust-SSH (kein OpenSSL nötig). "ring" statt "aws-lc-rs", damit unter
# Windows kein CMake/NASM gebraucht wird.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
